services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - pgenie

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    volumes:
      - ai_models:/app/model   # persist trained .joblib files
    networks:
      - pgenie

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
      - ai-service
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/pgenie
      JWT_SECRET: 904b1e9ed7f400d66487e4047127a8a0b2905abe819edb3f6eb42420aaa21e063c5e4a2aac81d95d6555e61668fe01615489bd67a07456dcb38f0568fba351d2
      REFRESH_SECRET: 99534f1cf8f0124c0b8dc9a754e4b919df581aee4b5c14220087420477aa24b1cef3b339addddc948ea7fe9b0752130d4a2e4f03f0a126c8cc5fee7a59868e28
      AES_KEY: b39d6d7a7a844308feffec6e8d1165b692a919dc7d50e29840382eedc3b79db5
      CLIENT_URL: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads    # persist uploaded PG photos
    networks:
      - pgenie
    ports:
      - "5001:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"              # app available at http://localhost:3000
    networks:
      - pgenie

volumes:
  mongo_data:
  uploads:
  ai_models:

networks:
  pgenie:
    driver: bridge
