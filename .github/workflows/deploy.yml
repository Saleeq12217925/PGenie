name: PGenie Cloud Deployment
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Build Frontend
        run: |
          cd client
          npm install
          npm run build
          
      - name: Build Backend
        run: |
          cd server
          npm install
          
      - name: Build Docker Images
        run: docker compose build
