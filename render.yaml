services:
  - type: web
    name: pgenie
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: AES_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PHOTO_STORAGE
        value: mongodb
      - key: TRUST_PROXY
        value: "1"
