services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - pgenie

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    volumes:
      - ai_models:/app/model
      - ./ai-service:/app         # hot-reload Python source
    networks:
      - pgenie

  server:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo
      - ai-service
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/pgenie
      JWT_SECRET: 904b1e9ed7f400d66487e4047127a8a0b2905abe819edb3f6eb42420aaa21e063c5e4a2aac81d95d6555e61668fe01615489bd67a07456dcb38f0568fba351d2
      REFRESH_SECRET: 99534f1cf8f0124c0b8dc9a754e4b919df581aee4b5c14220087420477aa24b1cef3b339addddc948ea7fe9b0752130d4a2e4f03f0a126c8cc5fee7a59868e28
      AES_KEY: b39d6d7a7a844308feffec6e8d1165b692a919dc7d50e29840382eedc3b79db5
      CLIENT_URL: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: development
    volumes:
      - ./server:/app
      - server_nm:/app/node_modules
      - uploads:/app/uploads
    networks:
      - pgenie

  client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - server
    environment:
      PROXY_TARGET: http://server:5000
      VITE_API_URL: ""
    volumes:
      - ./client:/app
      - client_nm:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - pgenie

volumes:
  mongo_data:
  uploads:
  ai_models:
  server_nm:
  client_nm:

networks:
  pgenie:
    driver: bridge
